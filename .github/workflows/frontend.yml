name: Frontend CI

on:
  push:
    branches: [ "main" ]
    paths: [ "frontend/**", ".github/workflows/frontend.yml" ]
  pull_request:
    branches: [ "main" ]
    paths: [ "frontend/**", ".github/workflows/frontend.yml" ]

permissions:
  contents: read

jobs:
  donor-mobile:
    name: Donor app (lint and unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/donor-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/donor-mobile/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx expo lint
      - run: npm test

  hospital-dashboard:
    name: Hospital dashboard (web build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/donor-web
    env:
      EXPO_PUBLIC_API_URL: https://haemnet-api.onrender.com
      EXPO_PUBLIC_WS_URL: wss://haemnet-api.onrender.com/ws/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/donor-web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx expo export --platform web --output-dir dist
