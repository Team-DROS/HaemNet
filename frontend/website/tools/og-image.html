<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;width:1200px;height:630px;background:#F5F7FA;font-family:'Space Grotesk','IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;color:#0F1A2B}
  .wrap{position:relative;width:1200px;height:630px;padding:64px 72px;box-sizing:border-box;overflow:hidden}
  .brand{display:flex;align-items:center;gap:16px;font-size:40px;font-weight:700;letter-spacing:-0.02em}
  h1{font-size:76px;line-height:1.05;letter-spacing:-0.035em;margin:56px 0 0;max-width:760px;font-weight:700}
  .sub{margin-top:28px;font-size:30px;color:#58637A;max-width:720px;line-height:1.3;font-family:'IBM Plex Sans',system-ui,sans-serif}
  .card{position:absolute;right:64px;top:150px;width:330px;background:#fff;border:2px solid #E4E8EF;border-radius:22px;box-shadow:0 12px 40px rgba(15,26,43,.10);overflow:hidden;font-family:'IBM Plex Sans',system-ui,sans-serif}
  .top{background:#FEF3F2;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #E4E8EF}
  .top b{font-size:28px;color:#B42318;font-family:'Space Grotesk',system-ui,sans-serif}
  .row{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;border-bottom:2px solid #E4E8EF;font-size:20px}
  .row:last-child{border-bottom:0}
  .chip{font-size:15px;font-weight:600;padding:5px 12px;border-radius:999px}
  .g{background:#E7F6EF;color:#08734F}.v{background:#F3F0FF;color:#5B34D6}.b{background:#EEF3FF;color:#1E46B8}.r{background:#FEF3F2;color:#B42318;font-size:14px}
  .bar{position:absolute;left:0;right:0;bottom:0;height:12px;background:#0F1A2B}
</style></head>
<body><div class="wrap">
  <div class="brand"><svg width="52" height="52" viewBox="0 0 24 24"><path d="M12 2.6c-3.4 4.2-5.7 7-5.7 9.9a5.7 5.7 0 0 0 11.4 0c0-2.9-2.3-5.7-5.7-9.9z" fill="none" stroke="#0F1A2B" stroke-width="1.5"/><path d="M12 9.6 9.2 14.4M12 9.6l2.8 4.8M9.2 14.4h5.6" stroke="#0F1A2B" stroke-width="1" opacity=".55"/><circle cx="12" cy="9.6" r="1.7" fill="#D92D20"/><circle cx="9.2" cy="14.4" r="1.3" fill="#0F1A2B"/><circle cx="14.8" cy="14.4" r="1.3" fill="#0F1A2B"/></svg>HaemNet</div>
  <h1>Find blood donors fast, when every minute counts.</h1>
  <div class="sub">AI voice calls in English, Hindi and Tamil. One live dashboard for every reply.</div>
  <div class="card">
    <div class="top"><b>O&minus; &middot; 3 units</b><span class="chip r">Critical</span></div>
    <div class="row"><span>Donor A</span><span class="chip g">Accepted</span></div>
    <div class="row"><span>Donor B</span><span class="chip v">On a call</span></div>
    <div class="row"><span>Donor C</span><span class="chip b">Ringing</span></div>
  </div>
  <div class="bar"></div>
</div></body></html>
