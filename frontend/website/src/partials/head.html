<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{page.fullTitle}}</title>
<meta name="description" content="{{page.description}}">
<link rel="canonical" href="{{page.url}}">
{{#if page.noindex}}<meta name="robots" content="noindex, nofollow">{{/if}}
<meta name="theme-color" content="#0F1A2B">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{site.name}}">
<meta property="og:title" content="{{page.fullTitle}}">
<meta property="og:description" content="{{page.description}}">
<meta property="og:url" content="{{page.url}}">
<meta property="og:image" content="{{page.ogImage}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="HaemNet: emergency blood donor coordination with AI voice calls">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{page.fullTitle}}">
<meta name="twitter:description" content="{{page.description}}">
<meta name="twitter:image" content="{{page.ogImage}}">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<link rel="stylesheet" href="/css/styles.css">
<script src="/js/boot.js"></script>
{{#if site.plausibleDomain}}<script defer data-domain="{{site.plausibleDomain}}" src="https://plausible.io/js/script.js"></script>{{/if}}
