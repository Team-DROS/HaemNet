name: Android test APK (not for release)

# Builds an installable APK for testers straight from the repository.
#
# - The JavaScript bundle is embedded, so the app runs without Metro.
#   (The old workflow built a *debug* APK, which has no bundle and shows
#   "Unable to load script ... index.android.bundle" on a phone.)
# - It is signed with the Android debug key generated by the build. Android
#   treats it as a different app signer from EAS preview/production builds,
#   so testers must uninstall it before installing an EAS build.
# - Never distribute this APK to donors or upload it to Google Play. Use
#   `eas build --profile preview` (APK) or `--profile production` (AAB).
#
# No secrets are used or needed.

on:
  workflow_dispatch:
    inputs:
      abis:
        description: "Native architectures (comma separated)"
        required: false
        default: "arm64-v8a,armeabi-v7a"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend/donor-mobile
    env:
      CI: "1"
      NODE_ENV: production
      EXPO_PUBLIC_API_URL: https://haemnet-api.onrender.com

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/donor-mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Static checks
        run: |
          npm test
          npm run lint

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Build release APK (bundled JS, debug-key signed)
        working-directory: frontend/donor-mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=${{ inputs.abis }}

      - name: Verify, checksum and describe the APK
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          SRC=android/app/build/outputs/apk/release/app-release.apk
          VERSION=$(node -p "require('./app.json').expo.version")
          OUT="HaemNet-Donor-v${VERSION}-test-${GITHUB_SHA::7}.apk"
          mkdir -p dist && cp "$SRC" "dist/$OUT"
          unzip -l "dist/$OUT" | grep -q "assets/index.android.bundle"
          "$BT/apksigner" verify --verbose --print-certs "dist/$OUT" > dist/signature.txt
          "$BT/aapt2" dump badging "dist/$OUT" | grep -E "^(package|sdkVersion|targetSdkVersion|native-code|application-label)" > dist/badging.txt
          (cd dist && sha256sum "$OUT" > SHA256SUMS.txt)
          {
            echo "commit: $GITHUB_SHA"
            echo "workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "signing: Android debug key (test build, not for distribution)"
            echo "api: $EXPO_PUBLIC_API_URL"
            cat dist/badging.txt
            cat dist/SHA256SUMS.txt
          } | tee dist/BUILD-INFO.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: haemnet-donor-test-apk
          path: frontend/donor-mobile/dist/
          if-no-files-found: error
          retention-days: 14
