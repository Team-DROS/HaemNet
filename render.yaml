# Render blueprint for HaemNet.
#
# In Render: New -> Blueprint -> pick this repository. It creates the API and
# the hospital dashboard. Secrets are marked sync:false, so Render asks for
# them instead of storing them in git.
#
# Before the first deploy you need:
#   * a MongoDB Atlas connection string (free M0 tier is enough)
#   * Twilio account SID, auth token and phone number (AI voice calls)
#   * a Sarvam AI API key
#
# After the API is live, set these three by hand (they need the real URLs):
#   API service   : SERVER_BASE_URL   https://<api-name>.onrender.com
#                   CORS_ORIGINS      ["https://<dashboard-name>.onrender.com"]
#   Dashboard     : EXPO_PUBLIC_API_URL  https://<api-name>.onrender.com
#                   EXPO_PUBLIC_WS_URL   wss://<api-name>.onrender.com/ws/dashboard
#
# Releases (see docs/RELEASING.md):
#   * staging  (haemnet-api-staging, haemnet-dashboard-staging) deploys every push to main
#     automatically, against its own database (haemnet_staging) and Twilio test settings.
#   * production (haemnet-api, haemnet-dashboard) never auto-deploys. The "Release" GitHub
#     workflow deploys it from a vX.Y.Z tag through Render deploy hooks, then waits until
#     /api/health reports the tagged commit.
#
# Free instances sleep when idle; the first request after a sleep takes a few
# seconds, and live WebSocket updates stop while asleep. Use a paid instance
# for a real blood bank.

services:
  - type: web
    name: haemnet-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /api/health
    # Production deploys only from a release tag (.github/workflows/release.yml).
    autoDeploy: false
    envVars:
      - key: APP_ENV
        value: production
      - key: DB_BACKEND
        value: mongodb
      - key: MONGODB_DATABASE
        value: haemnet
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: SARVAM_BASE_URL
        value: https://api.sarvam.ai
      - key: VOICE_INTENT_MODE
        value: ai
      - key: VOICE_INTENT_MODEL
        value: sarvam-105b
      - key: SENTRY_DSN
        sync: false
      - key: LOG_FORMAT
        value: json
      - key: TELEPHONY_PROVIDER
        value: twilio
      # Turn on once the donor app supports the SMS code flow.
      - key: DONOR_OTP_REQUIRED
        value: "false"
      # Optional, needed for more than one instance: a Render Key Value (Redis) URL.
      # Shares rate limits, call quotas and live dashboard updates across instances.
      - key: REDIS_URL
        sync: false
      # Private S3 or Cloudflare R2 bucket for hospital documents. Required on Render:
      # the disk is wiped on every deploy, so local uploads would be lost.
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      # Hospital verification and admin panel.
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: DASHBOARD_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: TURNSTILE_SECRET
        sync: false
      - key: CONTACT_TO
        sync: false
      - key: SERVER_BASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: haemnet-dashboard
    runtime: static
    rootDir: frontend/donor-web
    buildCommand: npm ci && npx expo export --platform web --output-dir dist
    staticPublishPath: ./dist
    # Production deploys only from a release tag (.github/workflows/release.yml).
    autoDeploy: false
    envVars:
      - key: EXPO_PUBLIC_API_URL
        sync: false
      - key: EXPO_PUBLIC_WS_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ── Staging: every push to main lands here first ─────────────────────────
  # Same code and settings as production, with its own database and accounts, so a bad
  # change never reaches real donors. Use Twilio test numbers or a single team phone here.
  - type: web
    name: haemnet-api-staging
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    branch: main
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: staging
      - key: DB_BACKEND
        value: mongodb
      # A separate database (same Atlas cluster is fine): staging never touches real donors.
      - key: MONGODB_DATABASE
        value: haemnet_staging
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: SARVAM_BASE_URL
        value: https://api.sarvam.ai
      - key: VOICE_INTENT_MODE
        value: ai
      - key: VOICE_INTENT_MODEL
        value: sarvam-105b
      - key: SENTRY_DSN
        sync: false
      - key: LOG_FORMAT
        value: json
      - key: TELEPHONY_PROVIDER
        value: twilio
      - key: DONOR_OTP_REQUIRED
        value: "false"
      # Keep staging cheap: few donors per request and few requests per day.
      - key: MAX_DONORS_PER_DISPATCH
        value: "5"
      - key: MAX_DISPATCHES_PER_HOSPITAL_DAY
        value: "10"
      - key: REDIS_URL
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: DASHBOARD_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: TURNSTILE_SECRET
        sync: false
      - key: CONTACT_TO
        sync: false
      - key: SERVER_BASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: haemnet-dashboard-staging
    runtime: static
    rootDir: frontend/donor-web
    branch: main
    buildCommand: npm ci && npx expo export --platform web --output-dir dist
    staticPublishPath: ./dist
    autoDeploy: true
    envVars:
      - key: EXPO_PUBLIC_API_URL
        sync: false
      - key: EXPO_PUBLIC_WS_URL
        sync: false
      - key: EXPO_PUBLIC_APP_ENV
        value: staging
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
