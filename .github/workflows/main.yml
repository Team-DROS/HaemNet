name: Python Backend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # The release workflow runs the same checks on the tagged commit before deploying it.
  workflow_call:

concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"
        cache: "pip"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Lint, format check and type check
      run: |
        pip install ruff==0.16.9 mypy==1.14.1
        ruff check backend
        ruff format --check backend
        mypy backend

    - name: Run backend tests
      env:
        JWT_SECRET: ci-only-secret-value-at-least-32-chars
        APP_ENV: development
        DB_BACKEND: mongodb
        MONGODB_TEST_URI: mongodb://127.0.0.1:27017
      run: python -m pytest backend/tests -q

  dependency-scan:
    # Informational for now: langgraph and langchain-core need a major upgrade
    # that must be tested on its own. Remove continue-on-error once they are updated.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v7
      with:
        python-version: "3.11"
    - run: pip install pip-audit
    - run: pip-audit -r backend/requirements.txt --no-deps --disable-pip
