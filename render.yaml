# Render blueprint for HaemNet.
#
# In Render: New -> Blueprint -> pick this repository. It creates the API and
# the hospital dashboard. Secrets are marked sync:false, so Render asks for
# them instead of storing them in git.
#
# Before the first deploy you need:
#   * a MongoDB Atlas connection string (free M0 tier is enough)
#   * Twilio account SID, auth token and phone number
#   * a Sarvam AI API key
#
# After the API is live, set these three by hand (they need the real URLs):
#   API service   : SERVER_BASE_URL   https://<api-name>.onrender.com
#                   CORS_ORIGINS      ["https://<dashboard-name>.onrender.com"]
#   Dashboard     : EXPO_PUBLIC_API_URL  https://<api-name>.onrender.com
#                   EXPO_PUBLIC_WS_URL   wss://<api-name>.onrender.com/ws/dashboard
#
# Free instances sleep when idle; the first request after a sleep takes a few
# seconds, and live WebSocket updates stop while asleep. Use a paid instance
# for a real blood bank.

services:
  - type: web
    name: haemnet-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DB_BACKEND
        value: mongodb
      - key: MONGODB_DATABASE
        value: haemnet
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: SARVAM_BASE_URL
        value: https://api.sarvam.ai
      - key: SENTRY_DSN
        sync: false
      - key: SERVER_BASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: haemnet-dashboard
    runtime: static
    rootDir: frontend/donor-web
    buildCommand: npm ci && npx expo export --platform web --output-dir dist
    staticPublishPath: ./dist
    autoDeploy: true
    envVars:
      - key: EXPO_PUBLIC_API_URL
        sync: false
      - key: EXPO_PUBLIC_WS_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
