name: Frontend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  dashboard:
    name: Hospital dashboard builds
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/donor-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/donor-web/package-lock.json
      - run: npm ci
      - run: node node_modules/expo/bin/cli export --platform web --output-dir dist

  mobile:
    name: Donor app lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/donor-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/donor-mobile/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  website:
    name: Public website links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python frontend/website/check_links.py
